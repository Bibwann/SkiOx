services:
  db:
    image: mysql:8.0
    container_name: mysql_ski
    restart: always
    env_file:
      - ./BDD/.env
    # variables loaded via env_file ./BDD/.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BDD/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - skiox_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_ski
    restart: always
    env_file:
      - ./BDD/.env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - skiox_network

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: skiox_api
    restart: unless-stopped
    env_file:
      - ./BDD/.env
    # env_file provides DB credentials; expose PORT and DB_HOST explicitly
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_NAME=skiox
      - DB_USER=skiox_user
      - DB_PASSWORD=skiox_pass
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - skiox_network

networks:
  skiox_network:

volumes:
  mysql_data:

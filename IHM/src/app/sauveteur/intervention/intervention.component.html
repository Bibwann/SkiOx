
<div class="card shadow-sm">
  <div class="card-body">
    <h5 class="card-title mb-3">Interventions</h5>

    <h6 class="text-muted mb-2">En cours</h6>
    <div class="vstack gap-2 mb-3">
      <button
        *ngFor="let it of ongoing"
        type="button"
        class="btn btn-outline-secondary d-flex align-items-center justify-content-between"
        [routerLink]="['/sauveteur', 'intervention', it.id]"
      >
        <span class="d-flex align-items-center gap-2">
          <i class="bi bi-broadcast-pin text-danger"></i>
          <span>{{ it.title }}</span>
        </span>
        <span class="badge bg-danger-subtle text-danger border border-danger-subtle">En cours</span>
      </button>
    </div>

    <h6 class="text-muted mb-2">Passée</h6>
    <div class="vstack gap-2">
      <button
        *ngFor="let it of past"
        type="button"
        class="btn btn-outline-secondary text-start"
        [routerLink]="['/sauveteur', 'intervention', it.id]"
      >
        {{ it.title }}
      </button>
    </div>
  </div>
</div>
